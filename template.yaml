AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Call Center Hospital Sao Bueno
  Infraestrutura Serverless para o bot de autoatendimento do hospital com Amazon Connect, Lambda e DynamoDB.

Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    Runtime: python3.12
    Environment:
      Variables:
        TABLE_PACIENTES: !Ref PacientesTable
        TABLE_CONSULTAS: !Ref DynamoDBTableSaoBuenoConsultas

Resources:

  # =========================================================================
  # 1. TABELAS DYNAMODB
  # =========================================================================
  PacientesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SaoBueno_Pacientes
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: CPF
          AttributeType: S
        - AttributeName: telefone
          AttributeType: S
      KeySchema:
        - AttributeName: CPF
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: GSI_Telefone
          KeySchema:
            - AttributeName: telefone
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  DynamoDBTableSaoBuenoConsultas:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SaoBueno_Consultas
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: CPF
          AttributeType: S
        - AttributeName: DataHora
          AttributeType: S
      KeySchema:
        - AttributeName: CPF
          KeyType: HASH
        - AttributeName: DataHora
          KeyType: RANGE

  # =========================================================================
  # 2. FUNÇÕES LAMBDA
  # =========================================================================
  
  # Função 1: Identifica o cliente pelo telefone ou CPF no Connect
  IdentificadorClientesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SaoBueno_IdentificadorClientes
      CodeUri: src/
      Handler: identificador_clientes.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PacientesTable

  # Função 2: Cadastra um novo cliente
  CadastrarClienteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SaoBueno_CadastrarCliente
      CodeUri: src/
      Handler: cadastrar_cliente.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PacientesTable

  # Função 3: Consulta os agendamentos/consultas do paciente
  ConsultarAgendamentosFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SaoBueno_ConsultarAgendamentos
      CodeUri: src/
      Handler: consultar_agendamentos.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DynamoDBTableSaoBuenoConsultas

  # Função 4: Cancela um agendamento/consulta existente
  CancelarAgendamentoFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SaoBueno_CancelarAgendamento
      CodeUri: src/
      Handler: cancelar_agendamento.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DynamoDBTableSaoBuenoConsultas

# =========================================================================
# 3. OUTPUTS
# =========================================================================
Outputs:
  PacientesTableName:
    Description: "Nome da Tabela DynamoDB dos Pacientes"
    Value: !Ref PacientesTable

  ConsultasTableName:
    Description: "Nome da Tabela DynamoDB das Consultas"
    Value: !Ref DynamoDBTableSaoBuenoConsultas

  IdentificadorClientesFunctionArn:
    Description: "ARN da Lambda Identificador de Clientes"
    Value: !GetAtt IdentificadorClientesFunction.Arn

  CadastrarClienteFunctionArn:
    Description: "ARN da Lambda de Cadastrar Cliente"
    Value: !GetAtt CadastrarClienteFunction.Arn

  ConsultarAgendamentosFunctionArn:
    Description: "ARN da Lambda de Consultar Agendamentos"
    Value: !GetAtt ConsultarAgendamentosFunction.Arn

  CancelarAgendamentoFunctionArn:
    Description: "ARN da Lambda de Cancelar Agendamento"
    Value: !GetAtt CancelarAgendamentoFunction.Arn
